services:
  backend:
    image: ${PRESSURE_BACKEND_IMAGE:?Set the reviewed local backend image ID}
    pull_policy: never
    platform: linux/amd64
    container_name: ${COMPOSE_PROJECT_NAME:?Set a dedicated Compose project name}-backend
    command: [serve]
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 45s
    pids_limit: 256
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m,mode=1777
    environment:
      DJANGO_SETTINGS_MODULE: backend.pressure_intranet_settings
      PRESSURE_PLATFORM_ROOT: ${PRESSURE_PLATFORM_ROOT:?Set a dedicated absolute host path}
      PERF_PRIVATE_ROOT: ${PRESSURE_PLATFORM_ROOT:?Set a dedicated absolute host path}/runtime/private
      PRESSURE_ALLOWED_HOSTS: ${PRESSURE_ALLOWED_HOSTS:?Set explicit intranet IPs or names}
      PRESSURE_PUBLIC_ORIGIN: ${PRESSURE_PUBLIC_ORIGIN:?Set the frontend HTTP origin}
      K6_RUNNER: DOCKER
      K6_DOCKER_BIN: /usr/local/bin/docker
      K6_LINUX_BIN: ${PRESSURE_PLATFORM_ROOT:?Set a dedicated absolute host path}/runtime/bin/k6-linux
      K6_EXPECTED_SHA256: ${K6_EXPECTED_SHA256:?Set the reviewed k6 binary SHA256}
      K6_DOCKER_IMAGE: ${K6_DOCKER_IMAGE:?Set the verified local runner image ID}
      K6_DOCKER_NETWORK: ${K6_DOCKER_NETWORK:?Set the existing dedicated bridge network}
      K6_DOCKER_CPUS: ${K6_DOCKER_CPUS:?Set the approved runner CPU limit}
      K6_DOCKER_MEMORY: ${K6_DOCKER_MEMORY:?Set the approved runner memory limit}
      MCP_ENABLED: "false"
      ANALYTICS_ENABLED: "false"
    volumes:
      - type: bind
        source: ${PRESSURE_PLATFORM_ROOT:?Set a dedicated absolute host path}/runtime
        target: ${PRESSURE_PLATFORM_ROOT:?Set a dedicated absolute host path}/runtime
        bind:
          create_host_path: false
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD, python, /opt/pressure-deploy/container.py, health]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [pressure]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  web:
    image: ${PRESSURE_WEB_IMAGE:?Set the reviewed local web image ID}
    pull_policy: never
    platform: linux/amd64
    user: "101:101"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    pids_limit: 64
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=32m,mode=0700,uid=101,gid=101
      - /var/cache/nginx:rw,nosuid,nodev,size=64m,mode=0700,uid=101,gid=101
    ports:
      - "${PRESSURE_BIND_IP:?Set the approved intranet bind IP}:${PRESSURE_HTTP_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks: [pressure]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
networks:
  pressure:
    external: true
    name: ${K6_DOCKER_NETWORK:?Set the existing dedicated bridge network}
