<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="568" viewBox="0 0 1440 568" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Pressure Platform — Know your load. Trust your results.</title>
  <desc id="desc">A workflow schematic: HTTP, bounded JSON WebSocket and bounded SSE scenarios flow through k6 to latency, error and integrity evidence. This is an illustration, not a dashboard or a benchmark.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" stroke="#E6EDF4" stroke-width="1"/></pattern>
    <linearGradient id="wash" x1="784" y1="64" x2="1364" y2="472" gradientUnits="userSpaceOnUse"><stop stop-color="#CFF3E9" stop-opacity=".5"/><stop offset="1" stop-color="#F6F9FC" stop-opacity="0"/></linearGradient>
  </defs>
  <rect x="1" y="1" width="1438" height="566" rx="24" fill="#F6F9FC" stroke="#DFE7EF" stroke-width="2"/>
  <rect x="772" y="36" width="632" height="438" rx="18" fill="url(#grid)"/>
  <rect x="772" y="36" width="632" height="438" rx="18" fill="url(#wash)"/>
  <g font-family="Arial, Helvetica, sans-serif">
