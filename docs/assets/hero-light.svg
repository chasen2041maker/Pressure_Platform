    <g fill="#FFFFFF" stroke="#DFE7EF"><rect x="802" y="200" width="126" height="44" rx="10"/><rect x="802" y="270" width="126" height="44" rx="10"/><rect x="802" y="340" width="126" height="44" rx="10"/></g>
    <g fill="#14263D" font-size="16" font-weight="700" text-anchor="middle"><text x="865" y="228">HTTP</text><text x="865" y="298">JSON WS</text><text x="865" y="368">Bounded SSE</text></g>
