    <circle cx="1175" cy="75" r="4" fill="#087D70"/>
    <text x="1190" y="80" fill="#526780" font-size="12" font-weight="700" letter-spacing="1.4">API LOAD TESTING</text>
    <text x="64" y="217" fill="#14263D" font-size="64" font-weight="700" letter-spacing="-2.8">Know your load.</text>
    <text x="64" y="288" fill="#087D70" font-size="64" font-weight="700" letter-spacing="-2.8">Trust your results.</text>
    <text x="66" y="341" fill="#526780" font-size="21">From API preparation to bounded execution,</text>
    <text x="66" y="373" fill="#526780" font-size="21">with evidence you can inspect.</text>
